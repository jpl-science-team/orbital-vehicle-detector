# Template dataset file for training on your own data (README Step 7).
# Copy it (e.g. to configs/my_data.yaml), edit the lines marked EDIT, then train with:
#   python src/train.py --data configs/my_data.yaml --img_size <size> --gpus <ids>
#
# Expected folder layout (one .txt label file per image, with the same name):
#   <path>/images/train/tile_001.png    <path>/labels/train/tile_001.txt
#   <path>/images/val/tile_101.png      <path>/labels/val/tile_101.txt
# Ultralytics finds each label by replacing "images" with "labels" in the image path.
#
# Each line of a label file is one object, as an oriented box:
#   <class_id> x1 y1 x2 y2 x3 y3 x4 y4
# where the four corners go around the box, x is divided by the image width and y by the
# image height (so all values are between 0 and 1), and class_id is a number from names below.
# An image with no objects gets an empty .txt file.

# EDIT: dataset folder. Relative paths are from the repo root (run the scripts from there);
# absolute paths also work.
path: data/my_data

# EDIT if your split folders have other names. Paths are relative to 'path'.
train: images/train   # images the model learns from
val: images/val       # images checked after every epoch; picks best.pt and stops training early

# EDIT: class names, numbered from 0 in the same order as the class IDs in your labels.
names:
  0: vehicle
  # 1: truck
